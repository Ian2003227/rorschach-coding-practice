<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>羅夏克編碼練習</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="loginPanel" class="panel">
  <h1>羅夏克編碼練習平台</h1>
  <div class="auth-tabs">
    <button data-mode="login" class="active">登入</button>
    <button data-mode="register">註冊新帳號</button>
  </div>
  <label>通關密語</label>
  <input id="pwInput" type="password" placeholder="輸入密語" autocomplete="off" />
  <label>暱稱</label>
  <input id="nicknameInput" type="text" maxlength="20" placeholder="自己取一個，之後用它登入" autocomplete="username" />
  <label>個人密碼</label>
  <input id="userPwInput" type="password" placeholder="至少 4 個字" autocomplete="current-password" />
  <div id="confirmRow" class="hidden">
    <label>再輸入一次個人密碼</label>
    <input id="userPwConfirm" type="password" autocomplete="new-password" />
    <p class="login-hint">個人密碼忘記了無法找回，只能換一個暱稱重新註冊，請記好。</p>
  </div>
  <button id="loginBtn">登入</button>
  <div id="loginError"></div>
</div>

<div id="appRoot" class="hidden">
  <header class="topbar">
    <div class="title">羅夏克編碼練習</div>
    <nav class="tabs">
      <button data-view="practice" class="active">練習</button>
      <button data-view="dashboard">儀表板</button>
      <button data-view="reference">速查表</button>
    </nav>
    <div class="user-badge"><span id="userBadge"></span> <button id="logoutBtn" class="btn-logout">登出</button></div>
  </header>

  <div class="wrap">

    <section id="view-practice">
      <div class="practice-toolbar">
        <label>順序
          <select id="orderMode">
            <option value="sequential">依章節順序</option>
            <option value="random">隨機</option>
            <option value="wrong">只出錯題</option>
          </select>
        </label>
        <label>章節
          <select id="sectionFilter"><option value="">全部</option></select>
        </label>
        <label>卡片
          <select id="cardFilter"><option value="">全部</option></select>
        </label>
        <button id="jumpBtn">跳到題號…</button>
        <button id="overviewBtn">📋 總覽 / 訂正本</button>
        <label class="checkbox-row" title="開啟後，答過的題目會自動顯示你上次的答案、對照正確答案，並把表單填回上次的作答">
          <input type="checkbox" id="reviewModeToggle" /> 訂正模式
        </label>
        <span class="progress-text" id="progressText"></span>
      </div>

      <div class="panel hidden" id="overviewPanel"></div>

      <div class="panel" id="questionPanel"></div>
    </section>

    <section id="view-dashboard" class="hidden">
      <div class="panel" id="dashboardPanel"></div>
    </section>

    <section id="view-reference" class="hidden">
      <div class="panel" id="referencePanel"></div>
    </section>

  </div>
</div>

<div id="lightbox" class="hidden"><img id="lightboxImg" /></div>

<script src="js/config.js"></script>
<script src="js/constants.js"></script>
<script src="js/crypto.js"></script>
<script src="js/grade.js"></script>
<script src="js/gas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
